name: m1-export-horizontal-audit

on:
  push:
    branches:
      - m1-adapter-evidence-20260831
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

env:
  PINNED_CONTROL_SHA: a707992c30a600d56d3fc2fa52a17a2844e1e25f
  FINAL_IMAGE: ghcr.io/s1475071992/gcclassic-paper1-checkpoint@sha256:4d46c34c0cde8e1ab0940e0d5c3d28d98016770333f1d8df2d4b1c9d51a45d75

jobs:
  export-step0:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert branch only adds evidence workflow
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PINNED_CONTROL_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$PINNED_CONTROL_SHA" HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/m1-export-horizontal-audit.yml"

      - name: Login to GHCR read-only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable final checkpoint image
        run: docker pull "$FINAL_IMAGE"

      - name: Export compact step-0 horizontal audit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf m1-evidence
          mkdir -p m1-evidence
          docker run --rm \
            -e FINAL_IMAGE="$FINAL_IMAGE" \
            -e PINNED_CONTROL_SHA="$PINNED_CONTROL_SHA" \
            -v "$PWD/m1-evidence:/out" \
            --entrypoint /bin/bash "$FINAL_IMAGE" -lc '
          set -euo pipefail
          python3 - <<"PY"
          import hashlib, json, os
          from pathlib import Path
          import numpy as np
          from netCDF4 import Dataset

          OUT=Path("/out")
          cases={
              "global": Path("/checkpoint/global/C/transport_audit.nc4"),
              "asia": Path("/checkpoint/nested/C/transport_audit.nc4"),
          }

          def sha256(path: Path) -> str:
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          meta={}
          for name,path in cases.items():
              validation=path.with_name("transport_audit_validation.json")
              with Dataset(path) as ds:
                  x=np.asarray(ds.variables["xmass_pjc_tpcore_hpa_step"][0], dtype=np.float64)
                  y=np.asarray(ds.variables["ymass_pjc_tpcore_hpa_step"][0], dtype=np.float64)
                  record={
                      "final_image": os.environ["FINAL_IMAGE"],
                      "control_repo_sha": os.environ["PINNED_CONTROL_SHA"],
                      "audit_schema_id": str(ds.getncattr("schema_id")),
                      "domain": str(ds.getncattr("domain_kind")),
                      "vertical_order": str(ds.getncattr("lev_tpcore")),
                      "vertical_operator_kind": str(ds.getncattr("vertical_operator_kind")),
                      "runtime_dt_s": float(ds.variables["runtime_dt_s"][0]),
                      "step_id": int(ds.variables["step_id"][0]),
                      "native_quantity_id": "GC_TPCORE_PRESSURE_INCREMENT_HPA_PER_CALL",
                      "source_transport_audit_sha256": sha256(path),
                      "source_transport_audit_validation_sha256": sha256(validation),
                      "source_transport_audit_validation": json.loads(validation.read_text()),
                      "xmass_shape": list(x.shape),
                      "ymass_shape": list(y.shape),
                      "source_fp_bytes": int(ds.getncattr("source_fp_bytes")),
                      "source_byte_order": str(ds.getncattr("source_byte_order")),
                  }
                  if name == "asia":
                      record["nested_domain"]="Asia"
                      record["buffer_cells"]={
                          "west": int(ds.getncattr("west_buffer")),
                          "east": int(ds.getncattr("east_buffer")),
                          "south": int(ds.getncattr("south_buffer")),
                          "north": int(ds.getncattr("north_buffer")),
                      }
                      record["transport_window_gc"]={
                          "i_start_gc": int(ds.getncattr("i_start_gc")),
                          "i_end_gc": int(ds.getncattr("i_end_gc")),
                          "j_start_gc": int(ds.getncattr("j_start_gc")),
                          "j_end_gc": int(ds.getncattr("j_end_gc")),
                      }
                  meta[name]=record
              np.savez_compressed(OUT/f"{name}_step0.npz", xmass_hpa_step=x, ymass_hpa_step=y)
          (OUT/"source_metadata.json").write_text(json.dumps(meta, indent=2, sort_keys=True)+"\n")
          PY
          '
          (cd m1-evidence && sha256sum global_step0.npz asia_step0.npz source_metadata.json > EXPORT_SHA256SUMS.txt)
          cat m1-evidence/source_metadata.json
          cat m1-evidence/EXPORT_SHA256SUMS.txt

      - name: Upload M1 horizontal evidence
        uses: actions/upload-artifact@v4
        with:
          name: m1-horizontal-audit-step0-${{ github.run_id }}
          path: m1-evidence/
          compression-level: 6
          retention-days: 90
