name: m1-export-horizontal-audit

on:
  push:
    branches:
      - m1-adapter-evidence-20260831
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

env:
  PINNED_CONTROL_SHA: a707992c30a600d56d3fc2fa52a17a2844e1e25f
  FINAL_IMAGE: ghcr.io/s1475071992/gcclassic-paper1-checkpoint@sha256:4d46c34c0cde8e1ab0940e0d5c3d28d98016770333f1d8df2d4b1c9d51a45d75

jobs:
  export-step0:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert branch only changes evidence workflow
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PINNED_CONTROL_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$PINNED_CONTROL_SHA" HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/m1-export-horizontal-audit.yml"

      - name: Login to GHCR read-only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable final checkpoint image
        run: docker pull "$FINAL_IMAGE"

      - name: Export frozen vertical and timing evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf m1-vertical-evidence m1-vertical-timing-evidence.tar m1-vertical-part-*
          mkdir -p m1-vertical-evidence
          docker run --rm \
            -e FINAL_IMAGE="$FINAL_IMAGE" \
            -e PINNED_CONTROL_SHA="$PINNED_CONTROL_SHA" \
            -v "$PWD/m1-vertical-evidence:/out" \
            --entrypoint /bin/bash "$FINAL_IMAGE" -lc '
          set -euo pipefail
          mkdir -p /out/global/OutputDir /out/global/Restarts /out/nested/OutputDir /out/nested/Restarts
          for case in global nested; do
            src="/checkpoint/$case/C"
            cp "$src/transport_audit.nc4" "/out/$case/transport_audit.nc4"
            cp "$src/transport_audit.manifest.json" "/out/$case/transport_audit.manifest.json"
            cp "$src/transport_audit_validation.json" "/out/$case/transport_audit_validation.json"
            cp "$src/HISTORY.rc" "/out/$case/HISTORY.rc"
            cp "$src/REFERENCE_CASE.json" "/out/$case/REFERENCE_CASE.json"
            if test -f "$src/REFERENCE_TIME_WINDOW.txt"; then cp "$src/REFERENCE_TIME_WINDOW.txt" "/out/$case/REFERENCE_TIME_WINDOW.txt"; fi
            cp "$src"/OutputDir/*.nc4 "/out/$case/OutputDir/"
            cp "$src"/Restarts/* "/out/$case/Restarts/"
          done
          python3 - <<"PY"
          import hashlib, json, os
          from pathlib import Path
          from netCDF4 import Dataset
          root=Path("/out")
          def sha256(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1024*1024), b""):
                      h.update(b)
              return h.hexdigest()
          summary={"final_image":os.environ["FINAL_IMAGE"],"control_repo_sha":os.environ["PINNED_CONTROL_SHA"],"cases":{}}
          for name in ["global","nested"]:
              p=root/name/"transport_audit.nc4"
              with Dataset(p) as ds:
                  summary["cases"][name]={
                    "sha256":sha256(p),
                    "schema_id":str(ds.getncattr("schema_id")),
                    "domain_kind":str(ds.getncattr("domain_kind")),
                    "variables":{k:{"dimensions":list(v.dimensions),"shape":list(v.shape),"dtype":str(v.dtype),"units":getattr(v,"units",None)} for k,v in ds.variables.items()},
                    "global_attributes":{a:str(ds.getncattr(a)) for a in ds.ncattrs()},
                  }
          (root/"EXPORT_SUMMARY.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          PY
          cd /out
          find . -type f ! -name EXPORT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > EXPORT_SHA256SUMS.txt
          '
          tar -cf m1-vertical-timing-evidence.tar m1-vertical-evidence
          sha256sum m1-vertical-timing-evidence.tar > m1-vertical-timing-evidence.tar.sha256
          split -b 300M -d -a 2 m1-vertical-timing-evidence.tar m1-vertical-part-
          ls -lh m1-vertical-part-* m1-vertical-timing-evidence.tar.sha256

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with: {name: m1-vertical-part-00-${{ github.run_id }}, path: m1-vertical-part-00, compression-level: 0, retention-days: 30, if-no-files-found: ignore}
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with: {name: m1-vertical-part-01-${{ github.run_id }}, path: m1-vertical-part-01, compression-level: 0, retention-days: 30, if-no-files-found: ignore}
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with: {name: m1-vertical-part-02-${{ github.run_id }}, path: m1-vertical-part-02, compression-level: 0, retention-days: 30, if-no-files-found: ignore}
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with: {name: m1-vertical-part-03-${{ github.run_id }}, path: m1-vertical-part-03, compression-level: 0, retention-days: 30, if-no-files-found: ignore}
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with: {name: m1-vertical-part-04-${{ github.run_id }}, path: m1-vertical-part-04, compression-level: 0, retention-days: 30, if-no-files-found: ignore}
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with: {name: m1-vertical-part-05-${{ github.run_id }}, path: m1-vertical-part-05, compression-level: 0, retention-days: 30, if-no-files-found: ignore}
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with: {name: m1-vertical-part-06-${{ github.run_id }}, path: m1-vertical-part-06, compression-level: 0, retention-days: 30, if-no-files-found: ignore}
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with: {name: m1-vertical-part-07-${{ github.run_id }}, path: m1-vertical-part-07, compression-level: 0, retention-days: 30, if-no-files-found: ignore}
      - name: Upload tar digest
        uses: actions/upload-artifact@v4
        with: {name: m1-vertical-tar-digest-${{ github.run_id }}, path: m1-vertical-timing-evidence.tar.sha256, compression-level: 0, retention-days: 30}
