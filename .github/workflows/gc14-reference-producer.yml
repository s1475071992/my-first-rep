name: gc14-reference-producer

on:
  push:
    branches:
      - gc14-7-1-reference-producer-v1
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install control-plane test dependency
        run: python -m pip install --upgrade pytest

      - name: Run control-plane contract tests
        shell: bash
        run: |
          if [[ -d tests ]]; then
            python -m pytest -q
          else
            echo "No tests directory yet; workflow bootstrap commit only."
          fi
