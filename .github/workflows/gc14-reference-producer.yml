name: gc14-reference-producer
# Run-only reference producer: reuse one explicitly pinned frozen GCClassic build.

on:
  push:
    branches:
      - gc14-7-1-reference-producer-v1
    paths:
      - .github/workflows/gc14-reference-producer.yml
      - config/frozen_gcclassic_build.json
      - config/reference_matrix.json
      - scripts/configure_reference_case.py
      - scripts/patch_history_for_window.py
      - scripts/download_official_inputs.sh
      - scripts/validate_dryrun.py
      - scripts/validate_reference_outputs.py
      - scripts/write_provenance.py
      - scripts/package_gc_holdout.py
      - tests/test_reference_producer_contract.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pytest pyyaml
      - name: Control-plane contract tests
        run: python -m pytest -q

  gcclassic-smoke:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORKROOT: /tmp/gc14-reference
      CASE_ID: GCEXT_JJA_20190701_SMOKE
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4

      - name: Install runtime dependencies only
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git libnetcdf-dev libnetcdff-dev netcdf-bin curl wget
          python -m pip install --upgrade pyyaml netCDF4 awscli
          {
            echo "python=$(python --version 2>&1)"
            echo "netcdf_c=$(nc-config --version)"
            echo "netcdf_fortran=$(nf-config --version)"
            echo "aws=$(aws --version 2>&1)"
          } | tee /tmp/runtime_toolchain.txt

      - name: Read frozen GCClassic build pin
        id: frozen
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          pin = json.loads(Path('config/frozen_gcclassic_build.json').read_text())
          print(f"run_id={pin['build_run_id']}")
          print(f"artifact_name={pin['artifact_name']}")
          print(f"bundle_filename={pin['bundle_filename']}")
          print(f"bundle_sha256={pin['bundle_sha256']}")
          print(f"executable_sha256={pin['executable_sha256']}")
          PY

      - name: Download exact frozen GCClassic build
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.frozen.outputs.artifact_name }}
          path: /tmp/gc14-reference/frozen-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.frozen.outputs.run_id }}

      - name: Restore and verify frozen GCClassic build
        run: |
          DL="$WORKROOT/frozen-download"
          BUNDLE="${{ steps.frozen.outputs.bundle_filename }}"
          test -f "$DL/$BUNDLE"
          test -f "$DL/$BUNDLE.sha256"
          test -f "$DL/frozen_build_manifest.json"
          cd "$DL"
          echo "${{ steps.frozen.outputs.bundle_sha256 }}  $BUNDLE" | sha256sum -c -
          sha256sum -c "$BUNDLE.sha256"
          rm -rf "$WORKROOT/GCClassic" "$WORKROOT/provenance" "$WORKROOT/rundirs" "$WORKROOT/frozen_build_manifest.json"
          tar -xzf "$DL/$BUNDLE" -C "$WORKROOT"
          RUNDIR="$WORKROOT/rundirs/gc_4x5_merra2_TransportTracers"
          test -x "$RUNDIR/gcclassic"
          test ! -d "$RUNDIR/build"
          mkdir -p "$WORKROOT/ExtData" "$RUNDIR/OutputDir" "$RUNDIR/Restarts" "$HOME/.geoschem"
          cat > "$HOME/.geoschem/config" <<EOF
          export GC_DATA_ROOT=$WORKROOT/ExtData
          export GC_USER_REGISTERED=true
          EOF
          python - <<'PY'
          import json
          from pathlib import Path
          pin = json.loads(Path('config/frozen_gcclassic_build.json').read_text())
          manifest = json.loads(Path('/tmp/gc14-reference/frozen_build_manifest.json').read_text())
          assert manifest['build_run_id'] == pin['build_run_id']
          assert manifest['gcclassic_version'] == pin['gcclassic_version']
          assert manifest['gcclassic_sha'] == pin['gcclassic_sha']
          assert manifest['geoschem_sha'] == pin['geoschem_sha']
          assert manifest['hemco_sha'] == pin['hemco_sha']
          assert manifest['executable_sha256'] == pin['executable_sha256']
          PY

      - name: Verify frozen executable identity
        run: |
          RUNDIR="$WORKROOT/rundirs/gc_4x5_merra2_TransportTracers"
          actual=$(sha256sum "$RUNDIR/gcclassic" | awk '{print $1}')
          expected="${{ steps.frozen.outputs.executable_sha256 }}"
          echo "actual=$actual"
          echo "expected=$expected"
          test "$actual" = "$expected"

      - name: Freeze transport-only JJA smoke case
        run: |
          RUNDIR="$WORKROOT/rundirs/gc_4x5_merra2_TransportTracers"
          python scripts/configure_reference_case.py \
            --rundir "$RUNDIR" \
            --case-id "$CASE_ID" \
            --start 20190701T000000 \
            --end 20190701T010000
          python scripts/patch_history_for_window.py "$RUNDIR/HISTORY.rc" --seconds 3600
          grep -E '^[[:space:]]*SpeciesConc\.(frequency|duration):' "$RUNDIR/HISTORY.rc"
          grep -E '^[[:space:]]*\*[[:space:]]+SPC_[[:space:]].*SpeciesRst_.*[[:space:]]CYS[[:space:]]+xyz' "$RUNDIR/HEMCO_Config.rc"

      - name: Dry-run and freeze official input manifest
        run: |
          RUNDIR="$WORKROOT/rundirs/gc_4x5_merra2_TransportTracers"
          cd "$RUNDIR"
          ./gcclassic --dryrun 2>&1 | tee log.dryrun
          python "$GITHUB_WORKSPACE/scripts/validate_dryrun.py" log.dryrun --output dryrun_summary.json
          ./download_data.py log.dryrun skip-download 2>&1 | tee download_data_skip.log
          cp log.dryrun "$WORKROOT/input_manifest_source.log"

      - name: Download only official dry-run inputs
        run: |
          RUNDIR="$WORKROOT/rundirs/gc_4x5_merra2_TransportTracers"
          bash scripts/download_official_inputs.sh "$RUNDIR" geoschem+aws

      - name: Execute one-hour transport-only GCClassic reference
        run: |
          RUNDIR="$WORKROOT/rundirs/gc_4x5_merra2_TransportTracers"
          cd "$RUNDIR"
          set +e
          ./gcclassic > GC.log 2>&1
          rc=$?
          set -e
          cat GC.log
          if [[ $rc -ne 0 ]]; then
            echo "REFERENCE_RUNTIME_FAILURE: gcclassic exit=$rc" >&2
            exit $rc
          fi
          grep -Ei "simulation.*complete|normal.*termination|GEOS-Chem.*complete" GC.log || true

      - name: Validate PassiveTracer endpoint
        run: |
          RUNDIR="$WORKROOT/rundirs/gc_4x5_merra2_TransportTracers"
          mkdir -p "$WORKROOT/validated"
          mapfile -t outputs < <(find "$RUNDIR/Restarts" -maxdepth 1 -type f -name 'GEOSChem.Restart.*.nc4' | sort)
          printf '%s\n' "${outputs[@]}"
          if [[ ${#outputs[@]} -eq 0 ]]; then
            echo "REFERENCE_OUTPUT_VALIDATION_FAILURE: no regular restart output" >&2
            exit 30
          fi
          python scripts/validate_reference_outputs.py "${outputs[@]}" --output "$WORKROOT/validated/output_validation.json"
          cp "${outputs[-1]}" "$WORKROOT/validated/final_restart.nc4"

      - name: Write immutable provenance and package holdout
        if: success()
        run: |
          RUNDIR="$WORKROOT/rundirs/gc_4x5_merra2_TransportTracers"
          mkdir -p "$WORKROOT/evidence/provenance" "$WORKROOT/evidence/rundir" "$WORKROOT/evidence/output"
          cp /tmp/runtime_toolchain.txt "$WORKROOT/evidence/provenance/runtime_toolchain.txt"
          cp "$WORKROOT/provenance/toolchain.txt" "$WORKROOT/evidence/provenance/build_toolchain.txt"
          cp "$WORKROOT/provenance/source_identity.txt" "$WORKROOT/evidence/provenance/"
          cp "$WORKROOT/provenance/submodules.txt" "$WORKROOT/evidence/provenance/"
          cp config/frozen_gcclassic_build.json "$WORKROOT/evidence/provenance/"
          cp "$WORKROOT/frozen_build_manifest.json" "$WORKROOT/evidence/provenance/"
          python scripts/write_provenance.py --gcclassic "$WORKROOT/GCClassic" --rundir "$RUNDIR" --output "$WORKROOT/evidence/provenance/reference_provenance.json"
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('/tmp/gc14-reference/evidence/provenance/reference_provenance.json')
          record = json.loads(out.read_text())
          pin = json.loads(Path('config/frozen_gcclassic_build.json').read_text())
          manifest = json.loads(Path('/tmp/gc14-reference/frozen_build_manifest.json').read_text())
          record['frozen_build'] = {
              'reused_without_recompile': True,
              'build_run_id': pin['build_run_id'],
              'artifact_id': pin['artifact_id'],
              'artifact_name': pin['artifact_name'],
              'artifact_digest': pin['artifact_digest'],
              'bundle_sha256': pin['bundle_sha256'],
              'executable_sha256': pin['executable_sha256'],
              'build_control_repo_sha': manifest['control_repo_sha'],
          }
          out.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          PY
          cp "$RUNDIR/REFERENCE_CASE.json" "$RUNDIR/geoschem_config.yml" "$RUNDIR/HEMCO_Config.rc" "$RUNDIR/HISTORY.rc" "$RUNDIR/log.dryrun" "$RUNDIR/download_data_skip.log" "$RUNDIR/download_official_inputs.log" "$RUNDIR/log.dryrun.after_download" "$RUNDIR/GC.log" "$WORKROOT/evidence/rundir/"
          cp "$WORKROOT/validated/output_validation.json" "$WORKROOT/validated/final_restart.nc4" "$WORKROOT/evidence/output/"
          python scripts/package_gc_holdout.py --case-id "$CASE_ID" --source-dir "$WORKROOT/evidence" --output-dir "$WORKROOT/package"

      - name: Upload success evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gc14-7-1-jja-smoke-${{ github.run_id }}
          path: /tmp/gc14-reference/package/
          compression-level: 0
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gc14-7-1-jja-smoke-failure-${{ github.run_id }}
          path: |
            config/frozen_gcclassic_build.json
            /tmp/runtime_toolchain.txt
            /tmp/gc14-reference/frozen-download/frozen_build_manifest.json
            /tmp/gc14-reference/frozen_build_manifest.json
            /tmp/gc14-reference/provenance/
            /tmp/gc14-reference/rundirs/gc_4x5_merra2_TransportTracers/REFERENCE_CASE.json
            /tmp/gc14-reference/rundirs/gc_4x5_merra2_TransportTracers/geoschem_config.yml
            /tmp/gc14-reference/rundirs/gc_4x5_merra2_TransportTracers/HEMCO_Config.rc
            /tmp/gc14-reference/rundirs/gc_4x5_merra2_TransportTracers/HISTORY.rc
            /tmp/gc14-reference/rundirs/gc_4x5_merra2_TransportTracers/log.dryrun
            /tmp/gc14-reference/rundirs/gc_4x5_merra2_TransportTracers/download_official_inputs.log
            /tmp/gc14-reference/rundirs/gc_4x5_merra2_TransportTracers/GC.log
          if-no-files-found: ignore
          retention-days: 14
