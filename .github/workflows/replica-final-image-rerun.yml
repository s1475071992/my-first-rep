name: replica-final-image-rerun

on:
  push:
    branches:
      - replica-verification-20260831
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

env:
  PINNED_CONTROL_SHA: a707992c30a600d56d3fc2fa52a17a2844e1e25f
  FINAL_IMAGE: ghcr.io/s1475071992/gcclassic-paper1-checkpoint@sha256:4d46c34c0cde8e1ab0940e0d5c3d28d98016770333f1d8df2d4b1c9d51a45d75

jobs:
  verify-and-rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert verification branch only adds this workflow
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PINNED_CONTROL_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$PINNED_CONTROL_SHA" HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/replica-final-image-rerun.yml"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate exact remote source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p replica-evidence
          python -m pip install --upgrade pip
          python -m pip install pytest numpy netCDF4 pyyaml
          python -m compileall -q scripts tests 2>&1 | tee replica-evidence/compileall.log
          set +e
          python -m pytest -q tests 2>&1 | tee replica-evidence/pytest.log
          pytest_rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$pytest_rc" > replica-evidence/pytest.exitcode
          python -m pytest -q tests/test_global_asia_checkpoint_contract.py 2>&1 | tee replica-evidence/release_gate_pytest.log
          git archive --format=tar.gz --prefix=my-first-rep-${PINNED_CONTROL_SHA}/ "$PINNED_CONTROL_SHA" > replica-evidence/remote-source-${PINNED_CONTROL_SHA}.tar.gz
          sha256sum replica-evidence/remote-source-${PINNED_CONTROL_SHA}.tar.gz > replica-evidence/remote-source-${PINNED_CONTROL_SHA}.tar.gz.sha256
          printf '%s\n' "$PINNED_CONTROL_SHA" > replica-evidence/pinned_control_sha.txt
          git rev-parse HEAD > replica-evidence/verification_branch_sha.txt

      - name: Login to GHCR read-only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and statically verify immutable final image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$FINAL_IMAGE" 2>&1 | tee replica-evidence/docker-pull.log
          docker image inspect "$FINAL_IMAGE" > replica-evidence/docker-image-inspect.json
          docker run --rm --entrypoint /bin/bash "$FINAL_IMAGE" -lc '
            set -euo pipefail
            test -f /checkpoint/CHECKPOINT_COMPLETE
            test -f /checkpoint/CHECKPOINT_MANIFEST.json
            test -f /checkpoint/qualification/QUALIFICATION.json
            test -f /checkpoint/SHA256SUMS
            test -d /checkpoint/ExtData
            test -d /checkpoint/global/C/OutputDir
            test -d /checkpoint/nested/C/OutputDir
            test -f /checkpoint/bc-producer/BC_VALIDATION_PASS
            test -x /checkpoint/software/global-instrumented/gcclassic
            test -x /checkpoint/software/asia-instrumented/gcclassic
            ! ldd /checkpoint/software/global-instrumented/gcclassic | grep -q "not found"
            ! ldd /checkpoint/software/asia-instrumented/gcclassic | grep -q "not found"
            test "$(git -C /checkpoint/control-repo rev-parse HEAD)" = "a707992c30a600d56d3fc2fa52a17a2844e1e25f"
            cd /checkpoint
            sha256sum -c SHA256SUMS
            python3 - <<"PY"
          import json
          from pathlib import Path
          m=json.loads(Path("/checkpoint/CHECKPOINT_MANIFEST.json").read_text())
          q=json.loads(Path("/checkpoint/qualification/QUALIFICATION.json").read_text())
          assert m["status"] == "PASS"
          assert q["status"] == "PASS"
          assert m["control_repo_sha"] == "a707992c30a600d56d3fc2fa52a17a2844e1e25f"
          assert q["control_repo_sha"] == "a707992c30a600d56d3fc2fa52a17a2844e1e25f"
          assert m["nested_domain"] == "Asia"
          assert q["scientific_thresholds_modified"] is False
          PY
          ' 2>&1 | tee replica-evidence/static-image-validation.log

      - name: Hydrate missing inputs and replay Global and Asia
        shell: bash
        run: |
          set -euo pipefail
          docker create --name torchctm-final-image-rerun --entrypoint /bin/bash "$FINAL_IMAGE" -lc 'sleep infinity' >/dev/null
          docker start torchctm-final-image-rerun >/dev/null
          set +e
          docker exec torchctm-final-image-rerun /bin/bash -lc '
            set -euo pipefail
            E=/tmp/replica-evidence
            rm -rf "$E" /tmp/frozen-global /tmp/frozen-nested
            mkdir -p "$E"
            cp -a /checkpoint/global/C /tmp/frozen-global
            cp -a /checkpoint/nested/C /tmp/frozen-nested

            reset_case() {
              local d="$1"
              rm -rf "$d/OutputDir" "$d/audit_raw"
              mkdir -p "$d/OutputDir" "$d/audit_raw"
              rm -f "$d/transport_audit.nc4" "$d/transport_audit.manifest.json" "$d/transport_audit_validation.json"
              find "$d/Restarts" -type f ! -name "*20190701_0000z*" ! -name "*201907010000*" -delete
            }

            reset_case /checkpoint/global/C
            cd /checkpoint/global/C
            ./gcclassic --dryrun > log.dryrun 2>&1
            cp log.dryrun "$E/global.dryrun.before_hydration.log"
            bash /checkpoint/control-repo/scripts/download_official_inputs.sh /checkpoint/global/C geoschem+aws > "$E/global.input-hydration.log" 2>&1
            cp log.dryrun.after_download "$E/global.dryrun.after_hydration.log"
            GC_TRANSPORT_AUDIT=1 GC_TRANSPORT_AUDIT_PATH=/checkpoint/global/C/audit_raw ./gcclassic > "$E/global.run.log" 2>&1
            python3 /checkpoint/control-repo/scripts/pack_transport_audit.py audit_raw transport_audit.nc4 > "$E/global.pack.log" 2>&1
            python3 /checkpoint/control-repo/scripts/validate_transport_audit.py transport_audit.nc4 --domain GLOBAL_LATLON --expected-steps 6 --expected-dt 600 --json-out transport_audit_validation.json > "$E/global.audit-validation.log" 2>&1
            python3 /checkpoint/control-repo/scripts/compare_gc_scientific_outputs.py /tmp/frozen-global /checkpoint/global/C --output "$E/global_vs_frozen.json" > "$E/global.compare.log" 2>&1
            cp transport_audit_validation.json "$E/global_transport_audit_validation.json"

            reset_case /checkpoint/nested/C
            cd /checkpoint/nested/C
            ./gcclassic --dryrun > log.dryrun 2>&1
            cp log.dryrun "$E/nested.dryrun.before_hydration.log"
            bash /checkpoint/control-repo/scripts/download_official_inputs.sh /checkpoint/nested/C nested+aws > "$E/nested.input-hydration.log" 2>&1
            cp log.dryrun.after_download "$E/nested.dryrun.after_hydration.log"
            GC_TRANSPORT_AUDIT=1 GC_TRANSPORT_AUDIT_PATH=/checkpoint/nested/C/audit_raw ./gcclassic > "$E/nested.run.log" 2>&1
            python3 /checkpoint/control-repo/scripts/pack_transport_audit.py audit_raw transport_audit.nc4 > "$E/nested.pack.log" 2>&1
            python3 /checkpoint/control-repo/scripts/validate_transport_audit.py transport_audit.nc4 --domain GEOSCHEM_NESTED_REGIONAL --expected-steps 12 --expected-dt 300 --json-out transport_audit_validation.json > "$E/nested.audit-validation.log" 2>&1
            python3 /checkpoint/control-repo/scripts/compare_gc_scientific_outputs.py /tmp/frozen-nested /checkpoint/nested/C --output "$E/nested_vs_frozen.json" > "$E/nested.compare.log" 2>&1
            cp transport_audit_validation.json "$E/nested_transport_audit_validation.json"

            python3 - <<"PY"
          import json
          from pathlib import Path
          e=Path("/tmp/replica-evidence")
          names=["global_vs_frozen.json","nested_vs_frozen.json","global_transport_audit_validation.json","nested_transport_audit_validation.json"]
          data={n:json.loads((e/n).read_text()) for n in names}
          assert all(v.get("status") == "PASS" for v in data.values()), data
          (e/"RERUN_PASS").write_text("GLOBAL_AND_ASIA_FINAL_IMAGE_RERUN_PASS_AFTER_INPUT_HYDRATION\n")
          (e/"rerun_summary.json").write_text(json.dumps(data,indent=2,sort_keys=True)+"\n")
          PY
          '
          rerun_rc=$?
          set -e
          mkdir -p replica-evidence/final-image-rerun
          docker cp torchctm-final-image-rerun:/tmp/replica-evidence/. replica-evidence/final-image-rerun/ || true
          docker cp torchctm-final-image-rerun:/checkpoint/control-repo replica-evidence/final-image-control-repo || true
          docker rm -f torchctm-final-image-rerun >/dev/null || true
          printf '%s\n' "$rerun_rc" > replica-evidence/final-image-rerun.exitcode
          test "$rerun_rc" -eq 0
          test -f replica-evidence/final-image-rerun/RERUN_PASS
          test "$(git -C replica-evidence/final-image-control-repo rev-parse HEAD)" = "$PINNED_CONTROL_SHA"
          find replica-evidence/final-image-rerun -type f -print0 | sort -z | xargs -0 sha256sum > replica-evidence/final-image-rerun-SHA256SUMS.txt
          find replica-evidence/final-image-control-repo -type f -not -path '*/.git/*' -print0 | sort -z | xargs -0 sha256sum > replica-evidence/final-image-control-repo-SHA256SUMS.txt

      - name: Upload independent replica verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torchctm-replica-verification-${{ github.run_id }}
          path: replica-evidence/
          compression-level: 6
          retention-days: 90
